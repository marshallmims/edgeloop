name: Wiki

on:
  push:
    # The wiki branch is the copy at wiki.edgeloop.app. dev and main
    # publish it again when this workflow is on those branches.
    branches: [wiki, dev, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and check the wiki
        run: node --test wiki/build.test.js && node wiki/build.js
      - name: Deploy wiki.edgeloop.app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing GitHub secret CLOUDFLARE_API_TOKEN."
            echo "The dev.edgeloop.app workflow uses the same token: Workers Scripts Edit, Workers Routes Edit, DNS Edit, and Zone Read on the edgeloop.app zone."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          npx wrangler deploy --config wrangler.wiki.jsonc
